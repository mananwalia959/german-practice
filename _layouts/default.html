<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #1f2328;
      background: #ffffff;
      margin: 0;
      padding: 2.5rem 1rem 5rem;
    }
    .content {
      max-width: 820px;
      margin: 0 auto;
    }
    h1, h2, h3, h4 { line-height: 1.25; margin-top: 1.8em; margin-bottom: .6em; font-weight: 600; }
    h1 { font-size: 2rem; padding-bottom: .3em; border-bottom: 1px solid #d8dee4; }
    h2 { font-size: 1.5rem; padding-bottom: .3em; border-bottom: 1px solid #d8dee4; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 85%;
      background: rgba(129,139,152,.12);
      padding: .2em .4em;
      border-radius: 6px;
    }
    pre {
      background: #f6f8fa;
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
    }
    pre code { background: none; padding: 0; font-size: 90%; }
    table { border-collapse: collapse; display: block; overflow: auto; margin: 1rem 0; }
    th, td { border: 1px solid #d8dee4; padding: 6px 13px; }
    th { background: #f6f8fa; }
    tr:nth-child(2n) td { background: #f6f8fa; }
    blockquote {
      margin: 1rem 0;
      padding: 0 1rem;
      color: #59636e;
      border-left: .25em solid #d8dee4;
    }
    hr { border: 0; border-top: 1px solid #d8dee4; margin: 2rem 0; }
    img { max-width: 100%; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; background: #0d1117; }
      h1, h2 { border-bottom-color: #30363d; }
      a { color: #4493f8; }
      pre, th { background: #161b22; }
      tr:nth-child(2n) td { background: #161b22; }
      th, td, hr, blockquote { border-color: #30363d; }
      blockquote { color: #9198a1; }
    }
  </style>
</head>
<body>
  <main class="content">
    {{ content }}
  </main>
</body>
</html>
